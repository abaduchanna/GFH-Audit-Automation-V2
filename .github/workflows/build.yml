name: Build GFH EXEs
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GFH Build ${{ github.run_number }}
  build_inventory:
    needs: create_release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - run: >
          pyinstaller --onefile --windowed --clean
          --name "GFH_Inventory_Audit"
          --icon "gfh_telecom_llc_icon.ico"
          --hidden-import win32gui --hidden-import win32con
          --hidden-import win32api --hidden-import win32process
          "GFH_Inventory_Audit.py"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: dist/GFH_Inventory_Audit.exe
  build_accessories:
    needs: create_release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - run: >
          pyinstaller --onefile --windowed --clean
          --name "GFH_Accessories_Ordering"
          --icon "gfh_telecom_llc_icon.ico"
          --collect-all selenium
          --collect-all webdriver_manager
          "GFH_Accessories_Ordering.py"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: dist/GFH_Accessories_Ordering.exe
